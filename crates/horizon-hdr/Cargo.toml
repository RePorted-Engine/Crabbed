[package]
name = "horizon-hdr"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.85"
description = "HDR metadata for the swapchain: the Vulkan calls the crates that forbid unsafe code can't make"

[dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["std"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["vulkan"] }
# The version wgpu-hal already uses.
ash = { version = "0.38", default-features = false }

[lints]
workspace = true
