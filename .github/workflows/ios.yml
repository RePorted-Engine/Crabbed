name: ios

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Add iOS target
        run: rustup target add aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build horizon-ios staticlib for iOS
        run: cargo rustc --release --locked --target aarch64-apple-ios -p horizon-ios --lib --crate-type staticlib
      - name: Generate Xcode project
        working-directory: packaging/ios
        run: xcodegen generate
      - name: Build unsigned iOS app
        run: |
          xcodebuild -project packaging/ios/HorizonIOS.xcodeproj -target Horizon -configuration Release \
            -sdk iphoneos -arch arm64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build-ios" build
      - name: Package IPA
        run: |
          mkdir -p ipa/Payload
          cp -a build-ios/Horizon.app ipa/Payload/
          (cd ipa && zip -qry ../Horizon-unsigned.ipa Payload)
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: horizon-ios-unsigned-ipa
          path: Horizon-unsigned.ipa
          if-no-files-found: error
